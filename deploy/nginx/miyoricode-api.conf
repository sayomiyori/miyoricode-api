# /etc/nginx/sites-available/miyoricode-api.conf
#
# Reverse-proxy for FastAPI on 127.0.0.1:8000 (Docker container).
# Domain: 103-74-92-163.nip.io (temporary; HTTPS via certbot later).
#
# IMPORTANT: /chat returns Server-Sent Events via StreamingResponse.
# SSE буферизация РАНЬШЕ ломалась на Render (Content-Length: 0, пустое тело),
# поэтому директивы против буферизации вынесены ТОЛЬКО в location /chat.
# НЕ дублировать их на уровне server или в location / — обычные JSON-эндпоинты
# выигрывают от дефолтной буферизации nginx (снижение syscall-ов, агрегация ответов).

server {
    listen 80;
    listen [::]:80;
    server_name 103-74-92-163.nip.io;

    # Общий access/error лог (можно переопределить позже при росте трафика).
    access_log /var/log/nginx/miyoricode-api.access.log;
    error_log  /var/log/nginx/miyoricode-api.error.log warn;

    # ─────────────────────────────────────────────────────────────────────────
    # SSE endpoint: POST /chat  →  StreamingResponse
    # Каждая директива ниже — против конкретного слоя, который может глотать
    # поток. Убирать любую из них = риск повторить инцидент с Render.
    # ─────────────────────────────────────────────────────────────────────────
    location = /chat {
        proxy_pass http://127.0.0.1:8000/chat;

        proxy_http_version 1.1;

        # Главное: отключить буферизацию ответа — nginx будет отдавать клиенту
        # каждый chunk сразу, как только его прислал upstream.
        proxy_buffering off;
        proxy_cache off;

        # SSE-стрим может висеть минуты/часы (длинная генерация ответа LLM).
        # Дефолт 60s рвёт соединение посередине.
        proxy_read_timeout 3600s;

        # Без явного сброса nginx может дописать "Connection: close" к upstream,
        # ломая keep-alive и вынуждая FastAPI закрывать TCP после первого chunk.
        proxy_set_header Connection '';

        # Явный запрет буферизации для промежуточных прокси-слоёв
        # (CDN, корпоративные proxy, отладочные тулзы типа charles/mitmproxy).
        add_header X-Accel-Buffering no always;

        # Transfer-Encoding: chunked — обязателен для SSE (Content-Length неизвестен).
        chunked_transfer_encoding on;

        # Стандартный набор проброса заголовков.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─────────────────────────────────────────────────────────────────────────
    # Все остальные эндпоинты (health, REST JSON, /docs, /openapi.json, etc.)
    # Дефолтная nginx-буферизация ON — оставляем как есть, она полезна
    # для агрегации мелких JSON-ответов и снижения нагрузки на upstream.
    # ─────────────────────────────────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";  # upstream keep-alive
    }
}